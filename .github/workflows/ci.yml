name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Client core builds for the browser
        run: >
          cargo check --target wasm32-unknown-unknown
          -p veltrunox-core -p veltrunox-protocol -p veltrunox-client-app
          -p veltrunox-client-adapters -p veltrunox-client-bridge

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked && cargo install wasm-pack --locked
      - run: cd app && flutter pub get
      - run: scripts/build-web.sh
      - name: Generated bridge code is up to date
        run: git diff --exit-code -- app/lib/bridge/generated crates/client-bridge/src/frb_generated.rs
