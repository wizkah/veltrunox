name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for audio and bindgen
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Client core builds for the browser
        run: >
          cargo check --target wasm32-unknown-unknown
          -p veltrunox-core -p veltrunox-protocol -p veltrunox-client-app
          -p veltrunox-client-adapters -p veltrunox-client-bridge

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for audio and bindgen
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Cache build tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/wasm-pack
          key: tools-frb-2.13.0-wasm-pack-${{ runner.os }}-v1
      - name: Install build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked && cargo install wasm-pack --locked
      - run: cd app && flutter pub get
      - run: scripts/build-web.sh
      - name: Generated bridge code is up to date
        run: git diff --exit-code -- app/lib/bridge/generated crates/client-bridge/src/frb_generated.rs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser test
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cargo build -p veltrunox-server --manifest-path ../Cargo.toml
          npx playwright test
          npx playwright test -c playwright.reconnect.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results
