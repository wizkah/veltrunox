version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Upgraded by hand, together with the code generator and the Dart package.
      - dependency-name: flutter_rust_bridge
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: flutter_rust_bridge
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its version is the Rust toolchain.
      - dependency-name: dtolnay/rust-toolchain
