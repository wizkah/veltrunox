[package]
name = "veltrunox-client-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veltrunox-core.workspace = true
veltrunox-client-app.workspace = true
veltrunox-client-adapters.workspace = true
flutter_rust_bridge = "=2.13.0"

# The desktop app carries the server; a browser cannot.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
veltrunox-server = { path = "../server" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
