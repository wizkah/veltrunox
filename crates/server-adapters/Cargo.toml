[package]
name = "veltrunox-server-adapters"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
veltrunox-core.workspace = true
veltrunox-protocol.workspace = true
veltrunox-server-app.workspace = true
axum = { workspace = true, features = ["ws"] }
