thiserror.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
signalsmith-stretch = "0.1.3"
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["all"] }
